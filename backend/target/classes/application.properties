# ===================================================================
# Spring Boot Configuration - Employee Management System
# ===================================================================

# Server Configuration
server.port=8080

# ===================================================================
# MySQL Database Configuration (Placeholders)
# Replace with your MySQL host, port, database name, and credentials
# or override via environment variables / JVM options
# ===================================================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:employee_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:your_mysql_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Optional: Set active profile if needed (e.g., spring.profiles.active=dev)
# If MySQL is not running on your machine, you can run with: --spring.profiles.active=dev
